name: CI

# Lint, build en tests bij elke push naar main en bij elke pull request.
# Bewust een apart bestand naast changelog.yml: die workflow heeft
# schrijfrechten op de repo nodig om zijn changelog-commit terug te pushen, en
# die rechten wil je niet uitbreiden naar een workflow die build- en teststappen
# draait. Deze workflow leest alleen.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 en niet 20: vitest 5 vereist ^22.12.0 || ^24.0.0 || >=26.0.0, en
      # vite, rolldown en oxlint vragen ^20.19.0 || >=22.12.0. Op Node 20 draaide
      # deze workflow dus op een versie die de toolchain zelf niet ondersteunt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci en niet npm install: alleen een installatie vanaf nul met een
      # lege node_modules legt bloot dat een pakket wel geïmporteerd wordt maar
      # niet (of in de verkeerde sectie) in package.json staat.
      - name: Installeren
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log

      # Tijdelijk: de foutuitvoer van npm staat alleen in de CI-log, en die is
      # niet zonder login te lezen. Het job summary komt wel publiek terug via
      # de API, dus daar zetten we 'm bij een mislukking neer. Weghalen zodra
      # de oorzaak bekend is.
      - name: Npm-uitvoer bij mislukking
        if: failure()
        run: |
          echo '### npm ci' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/npm-ci.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### omgeving' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { node -v; npm -v; ls -la; } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # En als annotatie, want dat is de enige uitvoer die zonder login
          # op te halen is.
          UIT=$(tail -30 /tmp/npm-ci.log; echo '--- omgeving ---'; node -v; npm -v; ls -la)
          UIT="${UIT//'%'/'%25'}"
          UIT="${UIT//$'
'/'%0A'}"
          UIT="${UIT//$''/'%0D'}"
          echo "::error::$UIT"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # audit-relations.mjs draait hier bewust niet mee: dat script verwacht het
      # pad naar een geëxporteerd JSON-bestand als argument, en dat bestand
      # bestaat in CI niet.
      - name: Vertalingen controleren
        run: node scripts/check-i18n.mjs
