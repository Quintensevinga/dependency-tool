name: CI

# Lint, build en tests bij elke push naar main en bij elke pull request.
# Bewust een apart bestand naast changelog.yml: die workflow heeft
# schrijfrechten op de repo nodig om zijn changelog-commit terug te pushen, en
# die rechten wil je niet uitbreiden naar een workflow die build- en teststappen
# draait. Deze workflow leest alleen.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: vitest 5 vereist ^22.12.0 || ^24.0.0 || >=26.0.0, dus de
      # oorspronkelijke Node 20 was uitgesloten. 24 is bovendien de versie
      # waarop hier ontwikkeld wordt, dus CI test dezelfde combinatie.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm install en niet npm ci, en dat is een bewuste concessie.
      #
      # npm ci eist dat de lockfile compleet is, en dat is hij hier niet: de
      # tailwind-keten bevat een optioneel wasm-pakket (@tailwindcss/oxide-
      # wasm32-wasi) dat op geen enkele machine hier gebruikt wordt, maar dat
      # wel een afhankelijkheid @emnapi/runtime declareert. npm op Windows laat
      # die bij het genereren van de lock weg -- ook met --include=optional en
      # met een geforceerd Linux-platform -- en npm ci op de runner weigert dan:
      #
      #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
      #   npm error code EUSAGE
      #
      # Daar is op deze machines niet omheen te komen zonder een pakket aan
      # package.json toe te voegen dat de app nergens gebruikt. npm install doet
      # op een lege node_modules hetzelfde werk (en legt dus nog steeds bloot
      # dat iets geimporteerd wordt zonder in package.json te staan); het vult
      # alleen dat ene gat zelf aan in plaats van te stoppen.
      - name: Installeren
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log

      # Bij een mislukking de reden als annotatie wegschrijven. De CI-log zelf
      # is niet zonder GitHub-login te lezen; annotaties wel. Dat schaaft bij
      # een volgende storing een paar blinde rondes af.
      - name: Reden bij mislukking
        if: failure()
        run: |
          { node -v; npm -v; echo '--- installatie ---'; head -20 /tmp/npm-ci.log; } | while IFS= read -r r; do
            echo "::error::$r"
          done

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # audit-relations.mjs draait hier bewust niet mee: dat script verwacht het
      # pad naar een geëxporteerd JSON-bestand als argument, en dat bestand
      # bestaat in CI niet.
      - name: Vertalingen controleren
        run: node scripts/check-i18n.mjs
